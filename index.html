<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  :root {
    --navy: #0f1f3d;
    --navy-light: #1c2f57;
    --gold: #c9a227;
    --gold-dark: #a8841d;
    --green-bg: #e6f4ea;
    --green-text: #1e6b3c;
    --green-border: #2f9e56;
    --ink: #1a1a1a;
    --muted: #6b7280;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 31, 61, 0.15);
  }

  .card-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #ffffff;
    padding: 28px 32px;
    text-align: center;
  }

  .card-header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  form {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--navy);
  }

  input,
  textarea {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fafafa;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(15, 31, 61, 0.12);
    background: #ffffff;
  }

  textarea {
    resize: vertical;
    min-height: 110px;
  }

  button[type="submit"] {
    margin-top: 6px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button[type="submit"]:hover {
    background: var(--gold-dark);
  }

  button[type="submit"]:active {
    transform: translateY(1px);
  }

  button[type="submit"]:focus-visible {
    outline: 3px solid var(--navy);
    outline-offset: 2px;
  }

  .success-message {
    display: none;
    margin-top: 4px;
    padding: 12px 14px;
    background: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
  }

  /* Pure CSS "submit" trick: a hidden checkbox is toggled by the submit
     label/button. When checked, the success message is revealed via the
     general sibling combinator. No JavaScript involved. */
  #submitted-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  #submitted-toggle:checked ~ .success-message {
    display: block;
  }

  #submitted-toggle:checked ~ .submit-label {
    background: var(--green-border);
    color: #ffffff;
  }

  .submit-label {
    display: inline-block;
    text-align: center;
    margin-top: 6px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
    user-select: none;
  }

  .submit-label:hover {
    background: var(--gold-dark);
  }

  .submit-label:active {
    transform: translateY(1px);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Contact Us</h1>
    </div>

    <form id="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
      </div>

      <input type="checkbox" id="submitted-toggle">
      <label for="submitted-toggle" class="submit-label">Submit</label>

      <div class="success-message">
        ✓ Your message has been sent successfully!
      </div>
    </form>
  </div>

</body>
</html>
