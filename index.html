<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  :root {
    --navy: #0f1f3d;
    --navy-light: #1c2f57;
    --gold: #c9a227;
    --gold-dark: #a8841d;
    --green-bg: #e6f4ea;
    --green-text: #1e6b3c;
    --green-border: #2f9e56;
    --red-bg: #fbeaea;
    --red-text: #a62c2c;
    --red-border: #d9534f;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 31, 61, 0.15);
  }
  .card-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #ffffff;
    padding: 28px 32px;
    text-align: center;
  }
  .card-header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  form {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.85rem; font-weight: 600; color: var(--navy); }
  input, textarea {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fafafa;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(15, 31, 61, 0.12);
    background: #ffffff;
  }
  textarea { resize: vertical; min-height: 110px; }
  button[type="submit"] {
    margin-top: 6px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--gold-dark); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    display: none;
    margin-top: 4px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
  }
  .success-message {
    background: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green-border);
  }
  .error-message {
    background: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Contact Us</h1>
    </div>

    <form id="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" id="submit-btn">Submit</button>

      <div class="message success-message" id="success-message">
        ✓ Your message has been sent successfully!
      </div>
      <div class="message error-message" id="error-message">
        ✗ Something went wrong. Please try again.
      </div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSZNIZI03ZbB9gIMhXmXLUOkG7-HHEVzQccO7TaF5XAc3C8t6HbcEQmIEfam6W23Wp/exec";

    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const successMsg = document.getElementById('success-message');
    const errorMsg = document.getElementById('error-message');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
        .then(() => {
          successMsg.style.display = 'block';
          form.reset();
        })
        .catch(() => {
          errorMsg.style.display = 'block';
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
        });
    });
  </script>

</body>
</html>
